schema: spec-driven

context: |
  Domain: time logging. Product outline is draft.md. Do not implement past that draft until asked.
  Interfaces: HTTP API and MCP. No UI.
  Auth: private tokens, no OAuth. List, create, and revoke tokens only by commands inside the Docker container.
  Storage: PostgreSQL for now. Other providers can be added later without changing the API and MCP contract.
  A log entry has start, end, name, tags, and comment.
  Tech stack: Node.js
  Commits: Conventional Commits via commitlint. Do not add Co-authored-by trailers.
  Releases: changelogen on GitHub Actions. The first release from 0.0.0 is 1.0.0.


